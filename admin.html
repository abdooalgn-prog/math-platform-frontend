<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم - أ. عبدالرحمن مصطفى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        .lessons-list-admin {
            margin-top: 30px;
        }
        .lessons-list-admin h3 {
            color: #38bdf8;
        }
        .admin-lesson-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .admin-lesson-card strong {
            color: #ffffff;
        }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">لوحة تحكم المعلم</div>
        <nav>
            <a href="courses.html">معاينة صفحة الدروس</a>
            <a href="login.html" onclick="sessionStorage.clear()" style="color: #f87171;">تسجيل خروج</a>
        </nav>
    </header>

    <div class="admin-container">
        <h2>إضافة درس جديد</h2>
        <br>
        <form id="addLessonForm">
            <div class="form-group">
                <label>عنوان الدرس:</label>
                <input type="text" id="lessonTitleInput" placeholder="مثال: الدرس الأول - الجبر والهندسة" required>
            </div>
            <div class="form-group">
                <label>رابط أو اسم ملف الفيديو (مثال: lesson1.mp4 أو رابط يوتيوب):</label>
                <input type="text" id="videoUrlInput" placeholder="lesson1.mp4" required>
            </div>
            <div class="form-group">
                <label>رابط ملف الـ PDF (المذكرة):</label>
                <input type="text" id="pdfUrlInput" placeholder="notes.pdf أو اتركه #">
            </div>
            <button type="submit" class="btn-main" style="width: 100%;">حفظ وإضافة الدرس</button>
        </form>

        <div class="lessons-list-admin">
            <h3>الدروس المضافة حالياً:</h3>
            <br>
            <div id="adminLessonsContainer"></div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            alert("عذراً، هذه الصفحة مخصصة للأستاذ عبدالرحمن فقط!");
            window.location.href = "login.html";
        }

        function loadAdminLessons() {
            const container = document.getElementById('adminLessonsContainer');
            container.innerHTML = '';
            
            let lessons = JSON.parse(localStorage.getItem('platform_custom_lessons')) || [];
            
            if (lessons.length === 0) {
                container.innerHTML = '<p style="color:#64748b;">لا توجد دروس مضافة حالياً.</p>';
                return;
            }

            lessons.forEach((lesson, index) => {
                const item = document.createElement('div');
                item.className = 'admin-lesson-card';
                item.innerHTML = `
                    <div>
                        <strong>${lesson.title}</strong>
                        <br><small style="color:#64748b;">المصدر: ${lesson.videoSrc}</small>
                    </div>
                    <button class="btn-delete" onclick="deleteLesson(${index})">حذف</button>
                `;
                container.appendChild(item);
            });
        }

        document.getElementById('addLessonForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('lessonTitleInput').value.trim();
            const videoSrc = document.getElementById('videoUrlInput').value.trim();
            const pdf = document.getElementById('pdfUrlInput').value.trim() || "#";

            let lessons = JSON.parse(localStorage.getItem('platform_custom_lessons')) || [];
            lessons.push({ id: Date.now(), title: title, videoSrc: videoSrc, pdf: pdf });

            localStorage.setItem('platform_custom_lessons', JSON.stringify(lessons));
            alert('تمت إضافة الدرس بنجاح!');
            
            document.getElementById('addLessonForm').reset();
            loadAdminLessons();
        });

        function deleteLesson(index) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا الدرس؟')) {
                let lessons = JSON.parse(localStorage.getItem('platform_custom_lessons')) || [];
                lessons.splice(index, 1);
                localStorage.setItem('platform_custom_lessons', JSON.stringify(lessons));
                loadAdminLessons();
            }
        }

        loadAdminLessons();
    </script>

</body>
</html>
